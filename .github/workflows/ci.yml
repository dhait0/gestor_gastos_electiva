name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy-migrations:
    name: Deploy Migrations to Supabase
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Versión fija: con `latest` el CLI 3.x empezó a exigir confirmación en cada `db push` y el job
      # fallaba en CI («Confirmation required… Re-run with --yes») sin aplicar nada. Subirla es una
      # decisión explícita, no algo que cambie solo entre un despliegue y otro.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Solo lista: deja en el log exactamente qué migraciones van a aplicarse a producción
      - name: Preview pending migrations (dry run)
        run: supabase db push --dry-run --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # `--yes` es necesario porque en CI no hay terminal para confirmar. Las migraciones son aditivas
      # y el job solo corre en push a `main`, protegido por el environment `production`.
      - name: Push migrations to Supabase
        run: supabase db push --yes --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}