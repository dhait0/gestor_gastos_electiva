services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finwise-web
    ports:
      - "6060:6060"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./dev.db
      - AUTH_SECRET=${AUTH_SECRET:-finwise-dev-secret-cambiar-en-produccion}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
    volumes:
      # Código fuente (la base SQLite persiste en el host vía este mount)
      - .:/app
      # Preserva node_modules del contenedor (no usar el del host)
      - /app/node_modules
    restart: unless-stopped
    develop:
      watch:
        # Cualquier cambio en el código se sincroniza al contenedor -> hot reload
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules
            - .next
            - .git
        # Cambios en dependencias reconstruyen la imagen automáticamente
        - action: rebuild
          path: package.json
